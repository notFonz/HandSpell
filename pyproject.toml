[project]
name = "handspell"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Afonso Silva"}
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "jupyter>=1.1.1",
    "scikit-image>=0.26.0",
    "ultralytics>=8.4.175",
]

[project.scripts]
handspell = "handspell:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
]
