[project]
name = "handspell"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Afonso Silva"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "ultralytics>=8.4.175",
    "scikit-image>=0.26.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "fastapi>=0.143.0",
    "aiofiles>=25.1.0",
    "keras>=3.15.1",
    "tensorflow>=2.21.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
handspell = "handspell:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
